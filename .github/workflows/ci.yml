name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

  build-electron:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Make
        run: npm run make

      - name: Test packaged renderer
        run: |
          # Chromium splits the Linux sandbox helper command at spaces.
          mv "out/Cycle Flyer-linux-x64" out/cycle-flyer-smoke
          sudo chown root:root out/cycle-flyer-smoke/chrome-sandbox
          sudo chmod 4755 out/cycle-flyer-smoke/chrome-sandbox
          xvfb-run -a node test/packaged-renderer.js out/cycle-flyer-smoke/cycle-flyer
